<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Gestão Avícola</title>
<meta name="theme-color" content="#1b3a2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;--ink:#1c2b24;--g:#2d6a4f;--gd:#1b3a2e;--gold:#e0a526;--bg:#f7f6f2;--mut:#6f7c74;--r:#b4452f;--ln:#ebebe4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--ln);background:rgba(247,246,242,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.lg{width:40px;height:40px;border-radius:12px;background:var(--gd);display:grid;place-items:center;overflow:hidden;flex-shrink:0}.lg img{width:100%;height:100%;object-fit:cover}.lg svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header b{display:block;font-size:15px;line-height:1.2}header span{font-size:12px;color:var(--mut)}
.mb{margin-left:auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
main{max-width:1000px;margin:auto;padding:22px 18px 60px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.eye{font-size:11px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}h1{font-size:27px;margin:2px 0;letter-spacing:-.02em}.sub{color:var(--mut);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.b{font:inherit;font-size:14px;font-weight:600;border-radius:12px;padding:11px 16px;border:1px solid var(--ln);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.b.p{background:var(--g);color:#fff;border-color:var(--g)}.b.s{padding:6px 11px;font-size:12px;font-weight:500;border-radius:99px;background:#f1f0ea}.b.s.on{background:var(--gd);color:#fff}.b.d{color:var(--r)}.b.w{width:100%;margin-top:16px}
.hero{background:var(--gd) radial-gradient(circle at 95% 0,rgba(224,165,38,.35),transparent 42%);color:#fff;border-radius:18px;padding:22px;margin-bottom:12px}
.hero .k{font-size:11px;letter-spacing:.14em;opacity:.7}.hero .v{font-size:28px;font-weight:650;margin:6px 0 16px}.hero .ft{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.15);padding-top:12px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}.g3{grid-template-columns:repeat(3,1fr)}
.kp{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px;min-width:0}
.kh{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.kh i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e8f1ec;color:var(--g)}
.kv{font-size:22px;font-weight:650;margin:8px 0 2px}.ks{font-size:12px;color:var(--mut)}.g3 .kp{padding:12px}.g3 .kv{font-size:20px}.g3 .ks{font-size:11px}.g3 .kh{letter-spacing:0;text-transform:none;font-size:11px}
.pos{color:var(--g)}.neg{color:var(--r)}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;margin-bottom:14px;overflow:hidden}.ch{padding:14px 16px;border-bottom:1px solid var(--ln)}.ch b{font-size:15px}.cb{padding:16px}
.emp{text-align:center;padding:22px 10px}.emp i{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#f1f0ea;color:var(--mut);margin-bottom:8px}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}.bl{background:#f7f6f2;border-radius:12px;padding:10px 14px;margin-bottom:10px}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0}.bar span:first-child{width:110px;font-size:13px}.bar i{display:block;height:18px;background:var(--g);border-radius:6px;min-width:3px}.bar i.top{background:var(--gold)}.bar .t{flex:1}.bar b{font-size:12px;white-space:nowrap}
.ok{display:flex;gap:10px;align-items:center;background:#e8f1ec;color:var(--g);border-radius:10px;padding:12px 14px}
.seg{display:flex;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:3px}.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font:inherit;cursor:pointer;color:var(--mut)}.seg .on{background:var(--gd);color:#fff}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:8px 6px}td{padding:11px 6px;border-top:1px solid var(--ln);font-size:13px}td:last-child{text-align:right;white-space:nowrap}
.nt{background:#fff4d6;color:#7a5a00;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.fm{display:grid;gap:14px}label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}label.chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink)}.chk input{width:auto}
input,.in{font:inherit;width:100%;padding:13px 14px;background:#f5f4ee;border:1px solid var(--ln);border-radius:12px;color:var(--ink);text-align:left}input:focus{outline:2px solid var(--g)}
.sel{cursor:pointer;display:flex;justify-content:space-between}.sel::after{content:'▾';color:var(--mut)}
.bk{position:fixed;inset:0;background:rgba(20,30,25,.45);backdrop-filter:blur(4px);z-index:20}
.sh{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px;z-index:21;max-width:560px;margin:auto}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:17px}.x{border:0;background:#f1f0ea;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
#pk .bk{z-index:30}#pk .sh{z-index:31}.op{display:block;width:100%;text-align:left;font:inherit;padding:14px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--ink)}.op.on{background:#e8f1ec;color:var(--g);font-weight:600}
.dw{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:85vw;background:#fff;z-index:21;padding:18px;overflow:auto}
.ni{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border:0;background:none;border-radius:12px;font:inherit;cursor:pointer;text-align:left;color:var(--ink)}.ni.on{background:#e8f1ec}.nh{font-size:11px;letter-spacing:.14em;color:var(--mut);margin:18px 6px 6px}
.lk{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}.lk.dark{background:#000;color:#fff}.lk input{max-width:320px;text-align:center}.lk .lg{width:64px;height:64px}
@media(max-width:600px){main{padding:16px 14px 50px}h1{font-size:23px}.bar span:first-child{width:80px}}
@media print{header,.acts,.nt,.b{display:none!important}}
</style>
</head>
<body>
<header id="hd"></header><main id="main"></main><div id="dr"></div><div id="md"></div><div id="pk"></div><div id="lock"></div>
<input type="file" id="imp" hidden accept=".json"><input type="file" id="lg" hidden accept="image/*">
<script>
const K='avi_v1',SP=['Galinha','Pato'],$=s=>document.querySelector(s);
const def=()=>({aves:{Galinha:{Adulta:0,Cria:0},Pato:{Adulta:0,Cria:0}},mort:{Galinha:0,Pato:0},mortLog:[],postura:[],incub:[],ovos:{Galinha:0,Pato:0},abat:{Galinha:0,Pato:0},custos:[],vendas:[],favo:30,logo:'',nome:'A minha exploração',racao:{kg:0,dia:0},saude:[],pin:'',lic:null});
let D;try{D=Object.assign(def(),JSON.parse(localStorage.getItem(K))||{})}catch(e){D=def()}
let PAGE='dash',PER='all',FIL='all',OK=false,PS,PT;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('Sem espaço para guardar os dados.')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const mzn=n=>(n||0).toLocaleString('pt-PT',{maximumFractionDigits:2})+' MZN';
const today=()=>new Date().toISOString().slice(0,10);
const addD=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const dd=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const fmt=d=>d.split('-').reverse().join('/');
if(!D.lic){D.lic={exp:addD(today(),30)};save()}
const num=id=>parseFloat($('#'+id).value)||0;
const val=id=>{const e=$('#'+id);return e.dataset.v!==undefined?e.dataset.v:e.value};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const live=s=>D.aves[s].Adulta+D.aves[s].Cria;
const inP=x=>PER==='all'||x.data.startsWith(today().slice(0,7));
const fld=(l,h)=>`<label>${l}${h}</label>`;
const inp=(id,t='number',v='')=>`<input id="${id}" type="${t}" ${t==='number'?'min="0" step="any"':''} value="${v}">`;
const sel=(id,a,v)=>{a=a.map(x=>Array.isArray(x)?x:[x,x]);const c=a.find(x=>x[0]===v)||a[0];return `<button type="button" class="in sel" id="${id}" data-v="${esc(c[0])}" data-o="${esc(JSON.stringify(a))}" onclick="pick('${id}')">${esc(c[1])}</button>`};
function pick(id){const e=$('#'+id),a=JSON.parse(e.dataset.o);$('#pk').innerHTML=`<div class="bk" onclick="$('#pk').innerHTML=''"></div><div class="sh"><div class="shh"><b>Escolher</b></div>${a.map(([v,l],i)=>`<button class="op ${v===e.dataset.v?'on':''}" data-i="${i}">${esc(l)}</button>`).join('')}</div>`;
 $('#pk').querySelectorAll('.op').forEach(b=>b.onclick=()=>{const o=a[b.dataset.i];e.dataset.v=o[0];e.textContent=o[1];$('#pk').innerHTML=''})}
function openM(t,b,l,fn){$('#md').innerHTML=`<div class="bk" onclick="closeM()"></div><div class="sh"><div class="shh"><b>${t}</b><button class="x" onclick="closeM()">${ic('x')}</button></div><div class="fm">${b}</div>${fn?`<button class="b p w" onclick="${fn}">${l}</button>`:''}</div>`}
const closeM=()=>{$('#md').innerHTML='';$('#pk').innerHTML=''};
const lbl=(t,s)=>({abat:s+(s==='Pato'?' abatido':' abatida'),ovos:'Ovos de '+s.toLowerCase(),cria:'Crias de '+s.toLowerCase()}[t]);
const favos=n=>{const f=Math.floor(n/D.favo),r=n%D.favo;return f+' favo'+(f===1?'':'s')+' completo'+(f===1?'':'s')+(r?` + 1 incompleto (${r} ovos)`:'')};
const nacub=s=>D.incub.filter(l=>!l.fim&&l.sp===s).reduce((a,l)=>a+l.colocados-l.chocados,0);
/* licença */
const SEC='avi#2026!chave',E0=Date.UTC(2020,0,1);
const hsh=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h};
const mk=n=>{const a=n.toString(36).toUpperCase().padStart(3,'0');return 'AVI-'+a+'-'+hsh(a+'|'+SEC).toString(36).toUpperCase().padStart(7,'0').slice(-6)};
const dec=c=>{const m=/^AVI-([0-9A-Z]{3})-([0-9A-Z]{6})$/.exec(String(c).trim().toUpperCase());if(!m||mk(parseInt(m[1],36))!==m[0])return null;return new Date(E0+parseInt(m[1],36)*864e5).toISOString().slice(0,10)};
const leftMs=()=>new Date(D.lic.exp+'T00:00:00')-Date.now();
function tleft(){const l=leftMs();if(l<=0)return 'expirada';const d=Math.floor(l/864e5),h=Math.floor(l%864e5/36e5);return d?`${d} dia${d>1?'s':''}${h?` e ${h} h`:''}`:`${h} h`}
function ativar(c){const d=dec(c);if(!d)return alert('Código inválido.');if(d<=D.lic.exp)return alert('Este código é antigo ou já foi usado.');D.lic.exp=d;save();alert('Licença ativada até '+fmt(d)+'.');gate()}
function entrar(){if(val('pw')===D.pin){OK=true;gate()}else alert('Senha incorreta.')}
function gate(){const L=$('#lock');
 if(leftMs()<=0){L.innerHTML=`<div class="lk dark"><svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#e5382b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg><h2 style="margin:0">Inserir código de licença</h2><div style="font-size:12px;opacity:.7">Contacte o desenvolvedor</div><input id="lc" placeholder="AVI-XXX-XXXXXX" style="background:#111;color:#fff;border-color:#333"><button class="b p" onclick="ativar($('#lc').value)">Ativar</button></div>`;return}
 if(D.pin&&!OK){L.innerHTML=`<div class="lk"><div class="lg">${logo()}</div><h2 style="margin:0">${esc(D.nome)}</h2><div class="sub">Digite a senha para entrar</div><input id="pw" type="password" placeholder="Senha"><button class="b p" onclick="entrar()">Entrar</button></div>`;return}
 L.innerHTML='';render()}
setInterval(()=>{if(leftMs()<=0&&!$('#lock').querySelector('.dark'))gate()},60000);

/* ---------- ações ---------- */
function addAves(){const q=num('q');if(q<=0)return;D.aves[val('s')][val('t')]+=q;const c=num('c');
 if(c>0)D.custos.push({id:uid(),data:today(),cat:'Aquisição de aves',sp:val('s'),valor:c,desc:q+' '+val('t').toLowerCase()+'(s)'});save();render()}
function addPostura(){const q=num('q'),i=num('i');if(q<=0)return;if(i>q)return alert('A incubadora não pode ter mais ovos do que os postos.');
 const s=val('s');D.postura.push({id:uid(),data:val('d'),sp:s,qtd:q});D.ovos[s]+=q-i;if(i>0)D.incub.push({id:uid(),sp:s,data:val('d'),colocados:i,chocados:0,fim:''});save();render()}
function chocar(){const l=D.incub.find(x=>x.id===val('l'));if(!l)return alert('Não há lote em curso.');const falta=l.colocados-l.chocados,c=parseInt(val('c'));
 if(isNaN(c)||c<0||c>falta)return alert('Número inválido. Máximo possível neste lote: '+falta);
 l.chocados+=c;D.aves[l.sp].Cria+=c;if($('#e').checked)l.fim=val('d');save();render()}
function addFavo(){const q=num('q');if(q<=0)return;D.ovos[val('s')]+=val('t')==='Favos completos'?q*D.favo:Math.min(q,D.favo-1);save();render()}
function baixaOvos(){const q=num('q'),s=val('s');if(q<=0||q>D.ovos[s])return alert('Quantidade inválida.');D.ovos[s]-=q;save();render()}
function setFavo(){const n=parseInt(val('fv'));if(n>0){D.favo=n;save();render()}}
function abater(){const q=parseInt(val('q')),s=val('s'),t=val('t');if(!q||q<=0||q>D.aves[s][t])return alert('Não há aves suficientes.');D.aves[s][t]-=q;D.abat[s]+=q;save();render()}
function addCusto(){const v=num('v');if(v<=0)return;D.custos.push({id:uid(),data:val('d'),cat:val('c'),sp:val('s'),valor:v,desc:val('x')});save();render()}
function applyV(v,sg){if(v.tipo==='abat')D.abat[v.sp]-=sg*v.base;else if(v.tipo==='ovos')D.ovos[v.sp]-=sg*v.base;else D.aves[v.sp].Cria-=sg*v.base}
function addVenda(){const t=val('t'),s=val('s'),q=num('q'),p=num('p');if(q<=0||p<=0)return;const un=t==='ovos'?val('u'):'un';
 const base=t==='ovos'&&un==='Favo'?q*D.favo:q,av=t==='abat'?D.abat[s]:t==='ovos'?D.ovos[s]:D.aves[s].Cria;
 if(base>av)return alert('Não tem stock suficiente. Tem apenas '+av+'.');const v={id:uid(),data:val('d'),tipo:t,sp:s,qtd:q,un,base,preco:p,total:q*p,cliente:val('cl').trim(),pago:val('pg')==='Pago'};applyV(v,1);D.vendas.push(v);save();render()}
function del(k,id){if(!confirm('Remover este registo?'))return;if(k==='vendas')applyV(D.vendas.find(x=>x.id===id),-1);D[k]=D[k].filter(x=>x.id!==id);save();render()}
function exportar(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='avicola-'+today()+'.json';a.click()}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{D=Object.assign(def(),JSON.parse(t));save();render()}catch(x){alert('Ficheiro inválido.')}})};
$('#lg').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{D.logo=r.result;save();render()};r.readAsDataURL(f)};


const IC={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',bird:'<path d="M16 7h.01M3 20c0-6 4-10 9-10l3-4 1.5 2.5L20 8l-2 2c0 5-4 10-10 10z"/>',egg:'<path d="M12 3c-4 0-7 6-7 11a7 7 0 0014 0c0-5-3-11-7-11z"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',leg:'<circle cx="9" cy="15" r="5"/><path d="M13 11l6-6M17 3l4 4"/>',grain:'<path d="M12 22V8M12 8c-3 0-5-2-5-5 3 0 5 2 5 5zM12 8c3 0 5-2 5-5-3 0-5 2-5 5zM12 15c-3 0-5-2-5-5 3 0 5 2 5 5zM12 15c3 0 5-2 5-5-3 0-5 2-5 5z"/>',heart:'<path d="M12 21C5 15 3 11 3 8a5 5 0 019-3 5 5 0 019 3c0 3-2 7-9 13z"/>',money:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',wallet:'<path d="M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2zM3 7l12-3v3M16 14h2"/>',gear:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',check:'<path d="M5 12l5 5 9-10"/>',o:'<circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24">${IC[n]}</svg>`;
const logo=()=>D.logo?`<img src="${D.logo}" alt="">`:'<svg viewBox="0 0 24 24"><path d="M12 21v-9"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>';
const head=(e,t,s,b='')=>`<div class="ph"><div><div class="eye">${e}</div><h1>${t}</h1><div class="sub">${s}</div></div><div class="acts">${b}</div></div>`;
const kp=(l,v,s,i,c='',go='')=>`<div class="kp" ${go?`onclick="go('${go}')" style="cursor:pointer"`:''}><div class="kh"><span>${l}</span>${i?`<i>${ic(i)}</i>`:''}</div><div class="kv ${c}">${v}</div><div class="ks">${s}</div></div>`;
const sec=(t,s,b)=>`<div class="card"><div class="ch"><b>${t}</b>${s?`<div class="sub">${s}</div>`:''}</div><div class="cb">${b}</div></div>`;
const emp=(t,s)=>`<div class="emp"><i>${ic('o')}</i><br><b>${t}</b><div class="sub">${s}</div></div>`;
const bt=(t,f,c='')=>`<button class="b ${c}" onclick="${f}">${c==='p'?ic('plus'):''}${t}</button>`;
const tb=(h,r)=>`<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r}</table></div>`;
const cls=n=>n>=0?'pos':'neg',pct=r=>r===null?'—':r.toFixed(1)+'%';
const prev=l=>addD(l.data,l.sp==='Pato'?28:21);
function stats(){const o={},tot=live('Galinha')+live('Pato');SP.forEach(s=>o[s]={rec:0,cus:0});
 D.vendas.filter(inP).forEach(v=>o[v.sp].rec+=v.total);
 D.custos.filter(inP).forEach(c=>{if(c.sp==='Geral')SP.forEach(s=>o[s].cus+=c.valor*(tot?live(s)/tot:.5));else o[c.sp].cus+=c.valor});
 SP.forEach(s=>{const x=o[s];x.luc=x.rec-x.cus;x.roi=x.cus>0?x.luc/x.cus*100:null});return o}
function alertas(){const a=[],r=D.racao;if(leftMs()<=2*864e5)a.push('A licença expira em '+tleft()+'. Contacte o desenvolvedor para renovar.');
